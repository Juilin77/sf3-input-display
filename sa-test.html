<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>SA Detection Tester</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; color: #ccc; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 14px; padding: 20px; }
h2 { color: #888; letter-spacing: 2px; margin-bottom: 16px; font-size: 13px; }

.section { margin-bottom: 20px; }

/* Numpad */
.numpad { display: grid; grid-template-columns: repeat(3, 48px); gap: 4px; }
.np-btn {
  width: 48px; height: 48px;
  background: #1a1a1a; border: 1px solid #2a2a2a;
  color: #888; font-size: 18px; cursor: pointer; border-radius: 3px;
}
.np-btn.active { background: #1a3a6a; border-color: #3366cc; color: #88aaff; }
.np-btn.center.active { background: #2a2a2a; border-color: #555; color: #ccc; }

/* Buttons */
.btn-row { display: flex; gap: 6px; margin-bottom: 6px; }
.sf-btn {
  padding: 6px 12px;
  background: #1a1a1a; border: 1px solid #2a2a2a;
  color: #888; cursor: pointer; border-radius: 3px; font-family: inherit; font-size: 13px;
}
.sf-btn.active { background: #3a1a1a; border-color: #cc4444; color: #ff8888; }

/* Controls */
.advance-btn {
  padding: 10px 24px; background: #1a3a1a; border: 1px solid #33aa33;
  color: #66cc66; cursor: pointer; font-family: inherit; font-size: 14px;
  border-radius: 3px; letter-spacing: 1px;
}
.advance-btn:hover { background: #224422; }
.reset-btn {
  padding: 10px 16px; background: #1a1a1a; border: 1px solid #444;
  color: #888; cursor: pointer; font-family: inherit; font-size: 13px; border-radius: 3px;
}

/* State display */
.state-box { background: #161616; border-radius: 4px; padding: 12px; margin-bottom: 16px; }
.state-row { display: flex; gap: 16px; margin-bottom: 6px; align-items: center; }
.state-label { color: #555; width: 60px; font-size: 12px; }
.state-val { color: #88aaff; font-size: 13px; font-weight: bold; }
.state-val.success { color: #44ff66; }
.state-val.fail { color: #ff4444; }

/* Log */
.log { max-height: 300px; overflow-y: auto; background: #0e0e0e; border-radius: 4px; padding: 8px; }
.log-entry { font-size: 12px; padding: 2px 0; border-bottom: 1px solid #1a1a1a; display: flex; gap: 8px; }
.log-frame { color: #555; width: 40px; flex-shrink: 0; }
.log-input { color: #888; flex: 1; }
.log-event { color: #aaa; flex: 1; }
.log-state { flex: 1; }
.log-state.success { color: #44ff66; font-weight: bold; }
.log-state.fail { color: #ff4444; font-weight: bold; }
</style>
</head>
<body>

<h2>SA DETECTION TESTER</h2>

<div style="display:flex; gap:32px; flex-wrap:wrap;">

<div>
<div class="section">
  <h2>DIRECTION (目前幀)</h2>
  <div class="numpad">
    <button class="np-btn" onclick="setDir(7)">↖</button>
    <button class="np-btn" onclick="setDir(8)">↑</button>
    <button class="np-btn" onclick="setDir(9)">↗</button>
    <button class="np-btn" onclick="setDir(4)">←</button>
    <button class="np-btn center" id="np-5" onclick="setDir(5)">●</button>
    <button class="np-btn" onclick="setDir(6)">→</button>
    <button class="np-btn" onclick="setDir(1)">↙</button>
    <button class="np-btn" onclick="setDir(2)">↓</button>
    <button class="np-btn" onclick="setDir(3)">↘</button>
  </div>
</div>

<div class="section">
  <h2>BUTTONS (目前幀)</h2>
  <div class="btn-row">
    <button class="sf-btn" id="b-LP" onclick="toggleBtn('LP')">LP</button>
    <button class="sf-btn" id="b-MP" onclick="toggleBtn('MP')">MP</button>
    <button class="sf-btn" id="b-HP" onclick="toggleBtn('HP')">HP</button>
    <button class="sf-btn" id="b-p3" onclick="toggleBtn('p3')">3P</button>
  </div>
  <div class="btn-row">
    <button class="sf-btn" id="b-LK" onclick="toggleBtn('LK')">LK</button>
    <button class="sf-btn" id="b-MK" onclick="toggleBtn('MK')">MK</button>
    <button class="sf-btn" id="b-HK" onclick="toggleBtn('HK')">HK</button>
    <button class="sf-btn" id="b-k3" onclick="toggleBtn('k3')">3K</button>
  </div>
</div>

<div class="section" style="display:flex; gap:8px; align-items:center;">
  <button class="advance-btn" onclick="advanceFrame()">▶ Next Frame</button>
  <button class="reset-btn" onclick="resetTest()">Reset</button>
</div>

<div class="section">
  <h2>SA SLOT</h2>
  <div class="btn-row">
    <button class="sf-btn" id="slot-1" onclick="setTestSlot(1)">DQCF+P</button>
    <button class="sf-btn" id="slot-2" onclick="setTestSlot(2)">DQCF+K</button>
  </div>
</div>
</div>

<div style="flex:1; min-width:280px;">
<div class="section">
  <h2>STATE</h2>
  <div class="state-box">
    <div class="state-row">
      <span class="state-label">Frame</span>
      <span class="state-val" id="st-frame">0</span>
    </div>
    <div class="state-row">
      <span class="state-label">QCF</span>
      <span class="state-val" id="st-qcf">IDLE</span>
    </div>
    <div class="state-row">
      <span class="state-label">QCB</span>
      <span class="state-val" id="st-qcb">IDLE</span>
    </div>
    <div class="state-row">
      <span class="state-label">Result</span>
      <span class="state-val" id="st-result">—</span>
    </div>
  </div>
</div>

<div class="section">
  <h2>LOG</h2>
  <div class="log" id="log"></div>
</div>
</div>

</div>

<script>
// ── SA Detection (copied from index.html) ──
const SA_MOT_WINDOW = 20;
const SA_BTN_WINDOW = 10;

const isDownDir = d => d === 1 || d === 2 || d === 3;
const isFwdDir  = d => d === 3 || d === 6 || d === 9;
const isBackDir = d => d === 1 || d === 4 || d === 7;

const CHARACTERS = {
  GOUKI: {
    sa: [
      { button: 'P' },
      { button: 'K' },
    ]
  }
};

let saMotQCF = { state: 'IDLE', frames: 0, entry: null, markedEntries: [] };
let saMotQCB = { state: 'IDLE', frames: 0, entry: null, markedEntries: [] };
let saMotPendingSuccess = false;

function saMotMarkFail(m) {
  m.state = 'IDLE'; m.frames = 0; m.entry = null;
}
function saMotSuccess(m) {
  m.markedEntries = [];
  m.state = 'IDLE'; m.frames = 0; m.entry = null;
}

function updateSAMot(m, enterDown, enterSide, btnPressed) {
  m.frames++;
  switch (m.state) {
    case 'IDLE':
      if (enterDown) { m.state = 'SAW_D1'; m.frames = 0; }
      break;
    case 'SAW_D1':
      if (m.frames > SA_MOT_WINDOW) { m.state = 'IDLE'; }
      else if (enterSide)           { m.state = 'SAW_S1'; m.frames = 0; }
      break;
    case 'SAW_S1':
      if (m.frames > SA_MOT_WINDOW) { m.state = 'IDLE'; }
      else if (enterDown)           { m.state = 'SAW_D2'; m.frames = 0; m.entry = null; }
      break;
    case 'SAW_D2':
      if (m.frames > SA_MOT_WINDOW)    { saMotMarkFail(m); }
      else if (enterSide && btnPressed) { saMotPendingSuccess = true; }
      else if (enterSide)              { m.state = 'WAIT_BTN';      m.frames = 0; m.entry = null; }
      else if (btnPressed)             { m.state = 'BTN_THEN_SIDE'; m.frames = 0; m.entry = null; }
      break;
    case 'BTN_THEN_SIDE':
      if (m.frames > SA_BTN_WINDOW) { saMotMarkFail(m); }
      else if (enterSide)           { saMotPendingSuccess = true; }
      break;
    case 'WAIT_BTN':
      if (m.frames > SA_BTN_WINDOW) { saMotMarkFail(m); }
      else if (btnPressed)          { saMotPendingSuccess = true; }
      break;
  }
}

// ── Test state ──
let frameCount = 0;
let testSlot = 1;
let currentDir = 5;
let currentBtns = { LP:false, MP:false, HP:false, LK:false, MK:false, HK:false, p3:false, k3:false };
let prevInput = null;

function makeInput(dir, btns) {
  const p3 = btns.p3 || false;
  const k3 = btns.k3 || false;
  return {
    dir,
    buttons: {
      rawLP: btns.LP, rawMP: btns.MP, rawHP: btns.HP,
      rawLK: btns.LK, rawMK: btns.MK, rawHK: btns.HK,
      p3, k3,
      LP: btns.LP || p3, MP: btns.MP || p3, HP: btns.HP || p3,
      LK: btns.LK || k3, MK: btns.MK || k3, HK: btns.HK || k3,
    }
  };
}

function setDir(d) {
  currentDir = d;
  document.querySelectorAll('.np-btn').forEach(b => b.classList.remove('active'));
  const map = {7:0,8:1,9:2,4:3,5:4,6:5,1:6,2:7,3:8};
  document.querySelectorAll('.np-btn')[map[d]]?.classList.add('active');
}

function toggleBtn(name) {
  currentBtns[name] = !currentBtns[name];
  document.getElementById('b-'+name)?.classList.toggle('active', currentBtns[name]);
}

function setTestSlot(slot) {
  testSlot = slot;
  document.getElementById('slot-1')?.classList.toggle('active', slot===1);
  document.getElementById('slot-2')?.classList.toggle('active', slot===2);
}

function advanceFrame() {
  const input = makeInput(currentDir, currentBtns);
  if (!prevInput) { prevInput = makeInput(5, {}); }

  const prev = prevInput;
  const sa = CHARACTERS['GOUKI'].sa[testSlot-1];

  const ev = {
    dirEnterDown: isDownDir(input.dir) && !isDownDir(prev.dir),
    dirEnterFwd:  isFwdDir(input.dir)  && !isFwdDir(prev.dir),
    dirEnterBack: isBackDir(input.dir) && !isBackDir(prev.dir),
    btnP: (input.buttons.rawLP && !prev.buttons.rawLP) || (input.buttons.rawMP && !prev.buttons.rawMP) || (input.buttons.rawHP && !prev.buttons.rawHP) || (input.buttons.p3 && !prev.buttons.p3),
    btnK: (input.buttons.rawLK && !prev.buttons.rawLK) || (input.buttons.rawMK && !prev.buttons.rawMK) || (input.buttons.rawHK && !prev.buttons.rawHK) || (input.buttons.k3 && !prev.buttons.k3),
  };
  const btnPressed = sa.button === 'P' ? ev.btnP : ev.btnK;

  saMotPendingSuccess = false;
  const qcfBefore = saMotQCF.state;
  const qcbBefore = saMotQCB.state;
  updateSAMot(saMotQCF, ev.dirEnterDown, ev.dirEnterFwd, btnPressed);
  updateSAMot(saMotQCB, ev.dirEnterDown, ev.dirEnterBack, btnPressed);

  let result = '—';
  if (saMotPendingSuccess) {
    saMotSuccess(saMotQCF); saMotSuccess(saMotQCB);
    result = 'SUCCESS';
  }

  frameCount++;
  prevInput = input;

  // events string
  const evts = [];
  if (ev.dirEnterDown) evts.push('enterD');
  if (ev.dirEnterFwd)  evts.push('enterFwd');
  if (ev.dirEnterBack) evts.push('enterBack');
  if (ev.btnP)         evts.push('btnP');
  if (ev.btnK)         evts.push('btnK');

  const dirSymbol = {1:'↙',2:'↓',3:'↘',4:'←',5:'●',6:'→',7:'↖',8:'↑',9:'↗'}[input.dir];
  const btnsStr = Object.entries(currentBtns).filter(([,v])=>v).map(([k])=>k).join('+') || '—';

  addLog(frameCount, `dir:${dirSymbol} btn:${btnsStr}`, evts.join(' ') || '—', saMotQCF.state, result);
  updateStateUI(result);

  // clear buttons after frame (持續按的話自己不清)
}

function addLog(frame, input, events, qcfState, result) {
  const log = document.getElementById('log');
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  const stateClass = result === 'SUCCESS' ? 'success' : result === 'FAIL' ? 'fail' : '';
  entry.innerHTML = `
    <span class="log-frame">#${frame}</span>
    <span class="log-input">${input}</span>
    <span class="log-event">${events}</span>
    <span class="log-state ${stateClass}">QCF:${qcfState} ${result !== '—' ? result : ''}</span>
  `;
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

function updateStateUI(result) {
  document.getElementById('st-frame').textContent = frameCount;
  const qcfEl = document.getElementById('st-qcf');
  qcfEl.textContent = saMotQCF.state;
  qcfEl.className = 'state-val' + (saMotQCF.state === 'WAIT_BTN' ? ' success' : '');
  document.getElementById('st-qcb').textContent = saMotQCB.state;
  const resEl = document.getElementById('st-result');
  resEl.textContent = result;
  resEl.className = 'state-val' + (result === 'SUCCESS' ? ' success' : result === 'FAIL' ? ' fail' : '');
}

function resetTest() {
  saMotQCF = { state: 'IDLE', frames: 0, entry: null, markedEntries: [] };
  saMotQCB = { state: 'IDLE', frames: 0, entry: null, markedEntries: [] };
  saMotPendingSuccess = false;
  frameCount = 0;
  prevInput = null;
  currentDir = 5;
  currentBtns = { LP:false, MP:false, HP:false, LK:false, MK:false, HK:false, p3:false, k3:false };
  document.querySelectorAll('.np-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('np-5')?.classList.add('active');
  document.querySelectorAll('.sf-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('st-frame').textContent = '0';
  document.getElementById('st-qcf').textContent = 'IDLE';
  document.getElementById('st-qcb').textContent = 'IDLE';
  document.getElementById('st-result').textContent = '—';
  document.getElementById('log').innerHTML = '';
  setTestSlot(testSlot);
}

// init
setDir(5);
setTestSlot(1);
</script>
</body>
</html>
